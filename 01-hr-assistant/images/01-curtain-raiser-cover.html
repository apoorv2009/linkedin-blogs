<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HR Assistant Cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #FAF7F2;
    color: #111;
    font-family: system-ui, sans-serif;
    position: relative;
  }
  .tag {
    position: absolute; top: 56px; left: 80px;
    background: #7EC8F2;
    border: 5px solid #111;
    box-shadow: 8px 8px 0 #111;
    padding: 12px 26px;
    font-size: 26px; font-weight: 800; letter-spacing: 2px;
  }
  h1 {
    position: absolute; top: 148px; left: 80px; width: 1760px;
    font-size: 74px; font-weight: 900; line-height: 1.22;
  }
  h1 mark {
    background: #FFD23F; color: #111;
    padding: 0 14px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  svg.diagram { position: absolute; top: 352px; left: 80px; }
  svg text { font-family: system-ui, sans-serif; font-weight: 800; fill: #111; }
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 124px;
    background: #111; color: #FAF7F2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 80px;
    font-size: 36px; font-weight: 700;
  }
  .hash {
    background: #FF4F9A; color: #111;
    border: 4px solid #FAF7F2;
    padding: 10px 24px; font-weight: 900;
  }
</style>
</head>
<body>

<div class="tag">BUILD US AN HR ASSISTANT · CURTAIN RAISER</div>

  <!-- Row 1: the visible front desk -->
  <g>

  <g>

    <text x="615" y="117" font-size="36" text-anchor="middle">Chat + answer</text>
  </g>
  <g transform="rotate(-4 760 28)">
    <rect x="666" y="4" width="200" height="48" fill="#FAF7F2" stroke="#111" stroke-width="4"/>
    <text x="766" y="38" font-size="24" text-anchor="middle">2-week demo</text>

  <g>

  <line x1="300" y1="105" x2="388" y2="105" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="836" y1="105" x2="928" y2="105" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1236" y1="105" x2="1328" y2="105" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>

  <line x1="615" y1="166" x2="615" y2="250" stroke="#111" stroke-width="6"/>
  <line x1="158" y1="250" x2="1602" y2="250" stroke="#111" stroke-width="6"/>
  <line x1="158" y1="250" x2="158" y2="298" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="519" y1="250" x2="519" y2="298" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="880" y1="250" x2="880" y2="298" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1241" y1="250" x2="1241" y2="298" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1602" y1="250" x2="1602" y2="298" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Row 2: the hidden back office -->

    <rect x="10" y="320" width="316" height="100" fill="#111"/>
    <rect x="0" y="310" width="316" height="100" fill="#FFFFFF" stroke="#111" stroke-width="5"/>
    <text x="158" y="372" font-size="30" text-anchor="middle">Who is asking?</text>
  </g>
  <g>
    <rect x="371" y="320" width="316" height="100" fill="#111"/>

    <text x="519" y="372" font-size="30" text-anchor="middle">Permissions</text>
  </g>

    <text x="880" y="372" font-size="30" text-anchor="middle">Country rules</text>
  </g>
  <g>
    <rect x="1093" y="320" width="316" height="100" fill="#111"/>
    <rect x="1083" y="310" width="316" height="100" fill="#FFFFFF" stroke="#111" stroke-width="5"/>
    <text x="1241" y="372" font-size="30" text-anchor="middle">Search index</text>
  </g>
  <g>
    <rect x="1454" y="320" width="306" height="100" fill="#111"/>
    <rect x="1444" y="310" width="306" height="100" fill="#FFFFFF" stroke="#111" stroke-width="5"/>
    <text x="1597" y="372" font-size="30" text-anchor="middle">Audit log</text>

  <g>
    <rect x="1093" y="482" width="316" height="80" fill="#111"/>
    <rect x="1083" y="472" width="316" height="80" fill="#7EC8F2" stroke="#111" stroke-width="5"/>

  </g>
  <line x1="1241" y1="472" x2="1241" y2="426" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/>
</svg>

<div class="bar">
  <span>Demos show the front desk. This series designs the hotel.</span>
  <span class="hash">#HRAssistantDesign</span>
</div>
