<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E9A23B"/></marker>
  </defs>
  <rect width="1200" height="627" fill="#F6F1E7"/>

  <!-- header -->
  <rect x="40" y="28" width="230" height="30" rx="15" fill="#1F2A44"/>
  <text x="155" y="48" font-size="14" fill="#F6F1E7" text-anchor="middle" font-weight="600">AI System Design · Part 1</text>
  <text x="600" y="104" font-size="32" fill="#1F2A44" text-anchor="middle" font-weight="700">An AI answer isn't data until it's checked</text>

  <!-- panel captions -->
  <text x="300" y="160" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">AT THE BANK</text>
  <text x="900" y="160" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">IN THE AI SYSTEM</text>
  <line x1="600" y1="150" x2="600" y2="580" stroke="#1F2A44" stroke-width="1" opacity="0.15"/>

  <!-- LEFT: supervisor desk (back) -->
  <g transform="translate(450,262)">
    <circle cx="0" cy="0" r="16" fill="#8D5B3E"/>
    <path d="M-24,56 Q-24,22 0,22 Q24,22 24,56 Z" fill="#E9A23B"/>
    <rect x="-46" y="50" width="92" height="12" rx="3" fill="#1F2A44"/>
  </g>
  <text x="450" y="345" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Supervisor</text>
  <!-- teller behind counter -->
  <g transform="translate(320,318)">
    <circle cx="0" cy="0" r="22" fill="#E8B996"/>
    <path d="M-34,82 Q-34,30 0,30 Q34,30 34,82 Z" fill="#2A9D8F"/>
  </g>
  <text x="320" y="292" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Teller checks</text>
  <!-- counter -->
  <rect x="200" y="398" width="330" height="18" rx="4" fill="#1F2A44"/>
  <rect x="215" y="416" width="300" height="110" fill="#1F2A44" opacity="0.10"/>
  <!-- deposit slip on counter -->
  <g transform="translate(222,346)">
    <rect x="0" y="0" width="80" height="48" rx="3" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="8" y="9" width="64" height="8" fill="none" stroke="#1F2A44" stroke-width="1.2"/>
    <rect x="8" y="22" width="40" height="8" fill="none" stroke="#1F2A44" stroke-width="1.2"/>
    <rect x="8" y="35" width="52" height="7" fill="none" stroke="#1F2A44" stroke-width="1.2"/>
  </g>
  <text x="270" y="452" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Deposit slip</text>
  <!-- customer in front -->
  <g transform="translate(130,372)">
    <circle cx="0" cy="0" r="22" fill="#C68E6A"/>
    <path d="M-36,150 Q-36,30 0,30 Q36,30 36,150 Z" fill="#1F2A44" opacity="0.85"/>
    <path d="M28,48 Q60,40 92,0" fill="none" stroke="#1F2A44" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="130" y="552" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Customer</text>

  <!-- RIGHT: flow -->
  <!-- invoice icon -->
  <g transform="translate(640,300)">
    <path d="M0,0 H44 L56,12 V72 H0 Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="22" x2="44" y2="22" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="34" x2="44" y2="34" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="46" x2="34" y2="46" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="60" x2="46" y2="60" stroke="#E9A23B" stroke-width="3"/>
  </g>
  <text x="668" y="395" font-size="14" fill="#1F2A44" text-anchor="middle">Invoice</text>
  <line x1="702" y1="336" x2="728" y2="336" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrN)"/>

  <!-- AI fills the form -->
  <rect x="732" y="296" width="128" height="80" rx="12" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
  <rect x="748" y="312" width="96" height="10" fill="none" stroke="#1F2A44" stroke-width="1.2"/>
  <rect x="748" y="328" width="60" height="10" fill="none" stroke="#1F2A44" stroke-width="1.2"/>
  <text x="796" y="363" font-size="14" fill="#1F2A44" text-anchor="middle" font-weight="600">AI fills the form</text>
  <line x1="860" y1="336" x2="886" y2="336" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrN)"/>

  <!-- checks gate -->
  <rect x="890" y="296" width="110" height="80" rx="12" fill="#1F2A44"/>
  <path d="M922,333 l10,10 l18,-20" fill="none" stroke="#E9A23B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955,333 l10,10 l18,-20" fill="none" stroke="#E9A23B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <text x="945" y="365" font-size="13" fill="#F6F1E7" text-anchor="middle" font-weight="600">Automatic checks</text>

  <!-- split -->
  <path d="M1000,326 C1040,326 1040,260 1070,260" fill="none" stroke="#2A9D8F" stroke-width="3" marker-end="url(#arrT)"/>
  <path d="M1000,346 C1040,346 1040,420 1070,420" fill="none" stroke="#E9A23B" stroke-width="3" marker-end="url(#arrA)"/>
  <rect x="1074" y="236" width="96" height="46" rx="10" fill="#2A9D8F"/>
  <text x="1122" y="265" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Approved</text>
  <rect x="1074" y="396" width="96" height="52" rx="10" fill="#E9A23B"/>
  <text x="1122" y="418" font-size="14" fill="#1F2A44" text-anchor="middle" font-weight="700">Sent to</text>
  <text x="1122" y="436" font-size="14" fill="#1F2A44" text-anchor="middle" font-weight="700">a person</text>

  <!-- matching badges -->
  <circle cx="196" cy="447" r="13" fill="#E9A23B"/><text x="196" y="452" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">1</text>
  <circle cx="254" cy="287" r="13" fill="#E9A23B"/><text x="254" y="292" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">2</text>
  <circle cx="386" cy="340" r="13" fill="#E9A23B"/><text x="386" y="345" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">3</text>
  <circle cx="796" cy="282" r="13" fill="#E9A23B"/><text x="796" y="287" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">1</text>
  <circle cx="945" cy="282" r="13" fill="#E9A23B"/><text x="945" y="287" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">2</text>
  <circle cx="1122" cy="466" r="13" fill="#E9A23B"/><text x="1122" y="471" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">3</text>

  <!-- footer -->
  <text x="40" y="602" font-size="13" fill="#1F2A44" opacity="0.6" xml:space="preserve">1  Fixed boxes to fill  ·  2  Checks in code  ·  3  A person for the doubtful cases</text>
  <text x="1160" y="602" font-size="13" fill="#1F2A44" opacity="0.6" text-anchor="end">Illustrative</text>
</svg>
