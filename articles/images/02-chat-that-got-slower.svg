<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
  </defs>
  <rect width="1200" height="627" fill="#F6F1E7"/>

  <!-- header -->
  <rect x="40" y="28" width="230" height="30" rx="15" fill="#1F2A44"/>
  <text x="155" y="48" font-size="14" fill="#F6F1E7" text-anchor="middle" font-weight="600">AI System Design · Part 2</text>
  <text x="600" y="104" font-size="32" fill="#1F2A44" text-anchor="middle" font-weight="700">The AI remembers nothing. You decide what it sees.</text>

  <text x="300" y="160" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">AT THE CLINIC</text>
  <text x="900" y="160" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">IN THE AI SYSTEM</text>
  <line x1="600" y1="150" x2="600" y2="580" stroke="#1F2A44" stroke-width="1" opacity="0.15"/>

  <!-- LEFT: doctor behind desk -->
  <g transform="translate(250,300)">
    <circle cx="0" cy="0" r="24" fill="#8D5B3E"/>
    <path d="M-38,92 Q-38,32 0,32 Q38,32 38,92 Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <path d="M-6,34 L0,60 L6,34" fill="none" stroke="#2A9D8F" stroke-width="3"/>
  </g>
  <!-- summary sheet held up -->
  <g transform="translate(140,270)">
    <rect x="0" y="0" width="70" height="92" rx="3" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="0" y="0" width="70" height="16" rx="3" fill="#2A9D8F"/>
    <line x1="10" y1="32" x2="60" y2="32" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="46" x2="52" y2="46" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="60" x2="58" y2="60" stroke="#1F2A44" stroke-width="2"/>
    <line x1="10" y1="74" x2="44" y2="74" stroke="#1F2A44" stroke-width="2"/>
  </g>
  <path d="M220,345 Q200,340 205,325" fill="none" stroke="#1F2A44" stroke-width="10" stroke-linecap="round" opacity="0.15"/>
  <text x="190" y="252" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Summary sheet</text>

  <!-- desk -->
  <rect x="100" y="392" width="440" height="18" rx="4" fill="#1F2A44"/>
  <rect x="120" y="410" width="400" height="110" fill="#1F2A44" opacity="0.10"/>

  <!-- thick patient file -->
  <g transform="translate(360,232)">
    <rect x="0" y="0" width="130" height="160" rx="4" fill="#E9A23B" opacity="0.35"/>
    <rect x="6" y="6" width="118" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="3" y="20" width="122" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="7" y="34" width="118" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="2" y="48" width="122" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="6" y="62" width="120" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="3" y="76" width="122" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="7" y="90" width="118" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="2" y="104" width="122" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="6" y="118" width="120" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="3" y="132" width="122" height="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <rect x="6" y="146" width="118" height="12" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1"/>
    <!-- buried flag -->
    <path d="M124,79 L170,79 L162,88 L170,97 L124,97 Z" fill="#D1495B"/>
  </g>
  <text x="536" y="325" font-size="13" fill="#D1495B" font-weight="700">Page 37</text>
  <text x="425" y="214" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Years of notes</text>
  <text x="320" y="555" font-size="14" fill="#1F2A44" text-anchor="middle" opacity="0.75">A stand-in doctor knows only what is in the file</text>

  <!-- RIGHT: one request -->
  <text x="840" y="200" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">What the AI reads, every message</text>
  <rect x="740" y="218" width="200" height="300" rx="14" fill="none" stroke="#1F2A44" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="756" y="234" width="168" height="56" rx="10" fill="#1F2A44"/>
  <text x="840" y="268" font-size="15" fill="#F6F1E7" text-anchor="middle" font-weight="600">Instructions</text>
  <rect x="756" y="302" width="168" height="56" rx="10" fill="#2A9D8F"/>
  <text x="840" y="336" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600">Last few messages</text>
  <rect x="756" y="370" width="168" height="56" rx="10" fill="#E9A23B" stroke="#1F2A44" stroke-width="2.5"/>
  <text x="840" y="404" font-size="16" fill="#1F2A44" text-anchor="middle" font-weight="700">Key facts</text>
  <rect x="756" y="438" width="168" height="64" rx="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
  <text x="840" y="476" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">New question</text>

  <!-- full history store -->
  <g transform="translate(1030,300)">
    <rect x="0" y="0" width="100" height="130" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="12" y="14" width="76" height="30" rx="3" fill="none" stroke="#1F2A44" stroke-width="2"/>
    <rect x="12" y="52" width="76" height="30" rx="3" fill="none" stroke="#1F2A44" stroke-width="2"/>
    <rect x="12" y="90" width="76" height="30" rx="3" fill="none" stroke="#1F2A44" stroke-width="2"/>
    <rect x="40" y="26" width="20" height="5" rx="2" fill="#1F2A44"/>
    <rect x="40" y="64" width="20" height="5" rx="2" fill="#1F2A44"/>
    <rect x="40" y="102" width="20" height="5" rx="2" fill="#1F2A44"/>
  </g>
  <text x="1080" y="285" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="600">Full history</text>
  <path d="M1028,380 C990,380 980,340 946,336" fill="none" stroke="#1F2A44" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrN)"/>
  <text x="1080" y="458" font-size="14" fill="#1F2A44" text-anchor="middle">Look up</text>
  <text x="1080" y="476" font-size="14" fill="#1F2A44" text-anchor="middle">when needed</text>

  <!-- matching badges -->
  <circle cx="112" cy="247" r="13" fill="#E9A23B"/><text x="112" y="252" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">1</text>
  <circle cx="356" cy="209" r="13" fill="#E9A23B"/><text x="356" y="214" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">2</text>
  <circle cx="726" cy="398" r="13" fill="#E9A23B"/><text x="726" y="403" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">1</text>
  <circle cx="1018" cy="280" r="13" fill="#E9A23B"/><text x="1018" y="285" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">2</text>

  <text x="40" y="602" font-size="13" fill="#1F2A44" opacity="0.6" xml:space="preserve">1  Summary sheet = key facts, always read  ·  2  The full file is kept, but read only when needed</text>
  <text x="1160" y="602" font-size="13" fill="#1F2A44" opacity="0.6" text-anchor="end">Illustrative</text>
</svg>
