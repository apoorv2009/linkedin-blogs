<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="1200" height="627" fill="#F6F1E7"/>

  <!-- header -->
  <rect x="40" y="28" width="230" height="30" rx="15" fill="#1F2A44"/>
  <text x="155" y="48" font-size="14" fill="#F6F1E7" text-anchor="middle" font-weight="600">AI System Design · Part 0</text>
  <text x="600" y="104" font-size="32" fill="#1F2A44" text-anchor="middle" font-weight="700">From demo to production, one decision at a time</text>

  <text x="300" y="158" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">BEFORE A LONG WALK</text>
  <text x="900" y="158" font-size="16" fill="#1F2A44" text-anchor="middle" letter-spacing="2" opacity="0.7">IN THIS SERIES</text>
  <line x1="600" y1="150" x2="600" y2="580" stroke="#1F2A44" stroke-width="1" opacity="0.15"/>

  <!-- LEFT: trail map signboard -->
  <rect x="150" y="400" width="12" height="120" fill="#1F2A44"/>
  <rect x="378" y="400" width="12" height="120" fill="#1F2A44"/>
  <rect x="110" y="196" width="320" height="214" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5"/>
  <text x="270" y="224" font-size="15" fill="#1F2A44" text-anchor="middle" font-weight="700">Trail map</text>
  <path d="M146,382 C210,382 196,334 256,334 S336,300 300,268 S372,246 398,246" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>
  <circle cx="146" cy="382" r="8" fill="#2A9D8F"/>
  <text x="146" y="402" font-size="12" fill="#1F2A44" text-anchor="middle" font-weight="600">Start</text>
  <line x1="398" y1="246" x2="398" y2="212" stroke="#1F2A44" stroke-width="2.5"/>
  <path d="M398,212 L420,220 L398,228 Z" fill="#E9A23B"/>
  <text x="398" y="266" font-size="12" fill="#1F2A44" text-anchor="middle" font-weight="600">Goal</text>

  <!-- ground -->
  <line x1="80" y1="520" x2="570" y2="520" stroke="#1F2A44" stroke-width="2" opacity="0.3"/>

  <!-- hiker -->
  <rect x="514" y="372" width="24" height="52" rx="6" fill="#E9A23B"/>
  <g transform="translate(500,340)">
    <circle cx="0" cy="0" r="20" fill="#C68E6A"/>
    <path d="M-30,112 Q-30,28 0,28 Q30,28 30,112 Z" fill="#1F2A44" opacity="0.85"/>
  </g>
  <line x1="490" y1="450" x2="484" y2="518" stroke="#1F2A44" stroke-opacity="0.85" stroke-width="11" stroke-linecap="round"/>
  <line x1="510" y1="450" x2="518" y2="518" stroke="#1F2A44" stroke-opacity="0.85" stroke-width="11" stroke-linecap="round"/>
  <path d="M478,388 Q462,400 462,414" fill="none" stroke="#1F2A44" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
  <line x1="462" y1="404" x2="448" y2="520" stroke="#8D5B3E" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="560" font-size="14" fill="#1F2A44" text-anchor="middle" opacity="0.75">See the whole route before you start</text>

  <!-- RIGHT: the route -->
  <polyline points="700,545 700,500 740,455 700,410 740,365 700,320 740,275 700,230 700,192" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="650" y="530" width="100" height="32" rx="16" fill="#2A9D8F"/>
  <text x="700" y="551" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Demo</text>
  <rect x="640" y="176" width="120" height="32" rx="16" fill="#1F2A44"/>
  <text x="700" y="197" font-size="15" fill="#F6F1E7" text-anchor="middle" font-weight="700">Production</text>

  <g font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">
    <circle cx="700" cy="500" r="14" fill="#E9A23B"/><text x="700" y="505">1</text>
    <circle cx="740" cy="455" r="14" fill="#E9A23B"/><text x="740" y="460">2</text>
    <circle cx="700" cy="410" r="14" fill="#E9A23B"/><text x="700" y="415">3</text>
    <circle cx="740" cy="365" r="14" fill="#E9A23B"/><text x="740" y="370">4</text>
    <circle cx="700" cy="320" r="14" fill="#E9A23B"/><text x="700" y="325">5</text>
    <circle cx="740" cy="275" r="14" fill="#E9A23B"/><text x="740" y="280">6</text>
    <circle cx="700" cy="230" r="14" fill="#E9A23B"/><text x="700" y="235">7</text>
  </g>

  <g font-size="16" fill="#1F2A44" font-weight="600">
    <text x="790" y="505">The AI is one part</text>
    <text x="790" y="460">Grounded answers</text>
    <text x="790" y="415">Memory and context</text>
    <text x="790" y="370">From answers to actions</text>
    <text x="790" y="325">Earning trust</text>
    <text x="790" y="280">Scale and failure</text>
    <text x="790" y="235">Running it for real</text>
  </g>
  <g font-size="13" fill="#1F2A44" opacity="0.6" text-anchor="end">
    <text x="1160" y="505">Parts 1–3</text>
    <text x="1160" y="460">4–10</text>
    <text x="1160" y="415">11–12</text>
    <text x="1160" y="370">13–17</text>
    <text x="1160" y="325">18–20</text>
    <text x="1160" y="280">21–27</text>
    <text x="1160" y="235">28–31</text>
  </g>

  <text x="40" y="602" font-size="13" fill="#1F2A44" opacity="0.6" xml:space="preserve">7 stretches  ·  31 short posts  ·  one every weekday</text>
  <text x="1160" y="602" font-size="13" fill="#1F2A44" opacity="0.6" text-anchor="end">Illustrative</text>
</svg>
